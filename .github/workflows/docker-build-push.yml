name: Build and Push Docker Image

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_ARTIFACT: docker-image

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image=${{ env.REGISTRY }}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ github.sha }}

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to a tarball
        run: docker save $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ') -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: image.tar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history improves SonarQube analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest app/ -v

      - name: Checkov IaC/Dockerfile scan
        continue-on-error: true # report-only: never blocks the pipeline
        uses: bridgecrewio/checkov-action@v12.3116.0
        with:
          directory: .
          framework: dockerfile,secrets
          output_format: cli,sarif
          output_file_path: console,checkov-results
          soft_fail: true

      - name: Ensure Checkov SARIF file exists
        if: always()
        run: |
          mkdir -p checkov-results
          [ -s checkov-results/results_sarif.sarif ] || echo '{"version":"2.1.0","runs":[]}' > checkov-results/results_sarif.sarif

      - name: Upload Checkov results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

      # SonarQube/SonarCloud is not configured yet. Add SONAR_TOKEN (and SONAR_HOST_URL for a
      # self-hosted server; skip it for SonarCloud) as repo secrets, and fill in
      # sonar-project.properties, before this step will produce real results.
      - name: SonarQube Scan
        continue-on-error: true # report-only, and safe to no-op until secrets are set
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        # Authenticated so Trivy's pull of ghcr.io/aquasecurity/trivy-db below doesn't
        # hit anonymous GHCR rate limits, which is the most common cause of Trivy
        # silently failing to produce a scan result in CI.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image vulnerability scan
        continue-on-error: true # report-only: never blocks the pipeline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Ensure Trivy SARIF file exists
        if: always()
        run: |
          [ -s trivy-results.sarif ] || echo '{"version":"2.1.0","runs":[]}' > trivy-results.sarif

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  push:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT }}

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tags
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ needs.build.outputs.tags }}"

  promote-to-main:
    runs-on: ubuntu-latest
    needs: [build, push]
    environment: production # manual approval gate — configure required reviewers in
    #   repo Settings -> Environments -> production. The job pauses here until someone
    #   with reviewer rights approves the run.
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag dev image as main/latest and push
        run: |
          SRC="${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}"
          docker pull "$SRC"
          docker tag "$SRC" "${{ needs.build.outputs.image }}:main"
          docker tag "$SRC" "${{ needs.build.outputs.image }}:latest"
          docker push "${{ needs.build.outputs.image }}:main"
          docker push "${{ needs.build.outputs.image }}:latest"
