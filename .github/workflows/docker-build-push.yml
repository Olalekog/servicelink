name: Build and Push Docker Image

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history improves SonarQube analysis

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "image=${{ env.REGISTRY }}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkov IaC/Dockerfile scan
        continue-on-error: true # report-only: never blocks the pipeline
        uses: bridgecrewio/checkov-action@v12.3116.0
        with:
          directory: .
          framework: dockerfile,secrets
          output_format: cli,sarif
          output_file_path: console,checkov-results
          soft_fail: true

      - name: Upload Checkov results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

      # SonarQube/SonarCloud is not configured yet. Add SONAR_TOKEN (and SONAR_HOST_URL for a
      # self-hosted server; skip it for SonarCloud) as repo secrets, and fill in
      # sonar-project.properties, before this step will produce real results.
      - name: SonarQube Scan
        continue-on-error: true # report-only, and safe to no-op until secrets are set
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ github.sha }}

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true # load into the local daemon so Trivy can scan it before it's pushed
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image vulnerability scan
        continue-on-error: true # report-only: never blocks the pipeline
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Push image
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  promote-to-main:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # manual approval gate — configure required reviewers in
    #   repo Settings -> Environments -> production. The job pauses here until someone
    #   with reviewer rights approves the run.
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag dev image as main/latest and push
        run: |
          SRC="${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha_tag }}"
          docker pull "$SRC"
          docker tag "$SRC" "${{ needs.build-and-push.outputs.image }}:main"
          docker tag "$SRC" "${{ needs.build-and-push.outputs.image }}:latest"
          docker push "${{ needs.build-and-push.outputs.image }}:main"
          docker push "${{ needs.build-and-push.outputs.image }}:latest"
